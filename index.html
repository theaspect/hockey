<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Хоккей</title>
  <meta name="theme-color" content="#24375e">
  <!-- iPad/iPhone: «На экран Домой» открывает игру на весь экран, как приложение -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Хоккей">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>
  <script src="js/compat.js"></script>
  <script src="js/input.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/rink.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/game.js"></script>
  <script>
    // Офлайн-режим работает только с сайта, не из файла.
    // Самообновление: при каждом возврате в игру проверяем, нет ли новой версии на сайте;
    // если есть — новый обработчик берёт управление, и страница один раз перезагружается.
    // (В режиме приложения на iPad кнопки «Обновить» нет.)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      const hadController = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.register('sw.js').then((registration) => {
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') registration.update();
        });
      });
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloading) return;
        reloading = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
